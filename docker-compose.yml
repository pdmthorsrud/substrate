version: '3.8'

services:
  playwright-browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-automation:latest
    container_name: playwright-browser
    # Recommended by Playwright: avoid special treatment for PID=1
    init: true
    # Recommended by Playwright: prevent Chromium from running out of memory
    ipc: host
    # Interactive shell
    stdin_open: true
    tty: true
    command: /usr/local/bin/start-vnc.sh
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      # Set to "false" for headed mode (visible via VNC)
      - HEADLESS=false
      - DISPLAY=:99
    ports:
      # VNC server port
      - "5900:5900"
      # noVNC web interface port
      - "6080:6080"
    volumes:
      # Mount screenshots directory to access screenshots from host
      - ./screenshots:/app/screenshots
      # Mount Python scripts for easy development/testing
      - ./test_navigation.py:/app/test_navigation.py
      - ./test_gemini_api.py:/app/test_gemini_api.py
      - ./gemini_computer_use.py:/app/gemini_computer_use.py
    # Shared memory size (important for Chrome to avoid crashes)
    shm_size: 2gb
    # Optional: Add restart policy
    restart: "no"
    # Optional: Add cap_add for local development if needed
    # cap_add:
    #   - SYS_ADMIN
    # Optional: Add network configuration if needed
    # networks:
    #   - playwright-network

# Optional: Define networks
# networks:
#   playwright-network:
#     driver: bridge
